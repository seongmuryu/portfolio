<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<style>body{margin:0}img{max-width:100%}[hidden]{display:none!important}</style>
<title>EV부품이력 시안</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@400;500;700&family=Noto+Serif+KR:wght@700&display=swap">
<style>
/* Layout: commerce site (list → detail → quote/order) plus a back-office screen and a formal report. Single light look. */
:root {
  --ink: #0D0D0E; --ink-2: #2D2E32; --sub: #5E6066; --line: #E6E7EA; --soft: #F5F5F6; --photo: #EEEFF1;
  --blue: #1E64C8; --ok: #007A3D; --warn: #B45309; --bad: #B42318; --gc: #6A4BB8;
  --navy: #1E3A5F; --bar: #26282C;
  --brand: #00874E; --brand-dark: #006B3E; --brand-soft: #EAF4EE;
  --sans: 'Noto Sans KR', system-ui, -apple-system, 'Apple SD Gothic Neo', sans-serif;
  --serif: 'Noto Serif KR', 'Batang', serif;
}
* { box-sizing: border-box; }
body { background: #FFFFFF; color: var(--ink); font-family: var(--sans); font-size: 14px; line-height: 1.5; }
body::before { content: ""; position: fixed; inset: 0 0 auto; height: env(safe-area-inset-top, 0px); z-index: 30; background: var(--bar); }
a { color: inherit; }
button, input, select, textarea { font-family: inherit; font-size: 14px; color: var(--ink); }
:focus-visible { outline: 2px solid var(--blue); outline-offset: 2px; }
.wrap { max-width: 1280px; margin: 0 auto; padding-left: max(24px, env(safe-area-inset-left, 0px)); padding-right: max(24px, env(safe-area-inset-right, 0px)); }
.num { font-variant-numeric: tabular-nums; }
.sr { position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0); white-space: nowrap; }

/* demo bar */
.demo { background: var(--bar); color: #FFFFFF; position: sticky; top: env(safe-area-inset-top, 0px); z-index: 25; }
.demo .wrap { display: flex; flex-wrap: wrap; align-items: center; gap: 4px 14px; min-height: 36px; padding-block: 4px; font-size: 12px; }
.demo span { color: #B9BBC0; }
.demo a { color: #FFFFFF; text-decoration: none; padding: 4px 8px; border-radius: 4px; }
.demo a:hover, .demo a.on { background: #3A3D42; }

/* shop header */
.site-header { border-bottom: 1px solid var(--line); background: #FFFFFF; }
.site-header .wrap { display: flex; flex-wrap: wrap; align-items: center; gap: 10px 32px; min-height: 64px; padding-block: 8px; }
.logo { font-size: 21px; font-weight: 700; letter-spacing: -0.03em; text-decoration: none; }
.logo small { font-size: 11px; font-weight: 400; color: var(--sub); margin-left: 4px; }
.gnb { display: flex; flex-wrap: wrap; gap: 4px 24px; font-size: 15px; }
.gnb a { text-decoration: none; color: #4A4B50; padding: 6px 0; }
.gnb a.on { color: var(--ink); font-weight: 700; }
.search { margin-left: auto; flex: 0 1 340px; min-width: 200px; display: flex; align-items: center; gap: 8px; height: 40px; padding: 0 6px 0 14px; background: var(--soft); border-radius: 20px; }
.search input { flex: 1; min-width: 0; border: none; background: transparent; outline: none; }
.icon-btn { width: 36px; height: 36px; border: none; background: transparent; display: inline-flex; align-items: center; justify-content: center; cursor: pointer; border-radius: 50%; }
.benefit { background: var(--ink); color: #FFFFFF; }
.benefit .wrap { display: flex; flex-wrap: wrap; justify-content: space-between; gap: 4px 20px; min-height: 38px; align-items: center; padding-block: 6px; font-size: 13px; font-weight: 500; }
.benefit i { font-style: normal; color: #8E9096; }

/* generic */
.btn { display: inline-flex; align-items: center; justify-content: center; gap: 6px; height: 48px; padding: 0 20px; border-radius: 8px; border: 1px solid #C9CACE; background: #FFFFFF; font-weight: 700; font-size: 15px; text-decoration: none; cursor: pointer; }
.btn:hover { border-color: var(--ink); }
.btn.dark { background: var(--ink); color: #FFFFFF; border-color: var(--ink); }
.btn.dark:hover { background: #2A2B2F; }
.btn.sm { height: 36px; padding: 0 14px; font-size: 13px; font-weight: 500; }
.chip { height: 36px; padding: 0 14px; border: 1px solid #DCDDE0; border-radius: 6px; background: #FFFFFF; font-size: 13px; cursor: pointer; color: var(--ink-2); }
.chip.on { border-color: var(--ink); background: var(--ink); color: #FFFFFF; font-weight: 700; }
.badge-grade { display: inline-block; font-size: 12px; font-weight: 700; color: #FFFFFF; border-radius: 4px; padding: 3px 7px; }
.tag { font-size: 11px; color: #4A4B50; background: var(--soft); border-radius: 4px; padding: 3px 7px; }
.crumb { display: flex; flex-wrap: wrap; gap: 8px; font-size: 13px; color: var(--sub); padding-block: 16px 14px; border-bottom: 1px solid var(--line); }
.crumb a { color: var(--sub); text-decoration: none; }
.crumb b { color: var(--ink); font-weight: 500; }
.tbl-scroll { overflow-x: auto; position: relative; }
.tbl { width: 100%; border-collapse: collapse; border-top: 1px solid var(--ink); }
.tbl th, .tbl td { padding: 11px 10px; border-bottom: 1px solid var(--line); text-align: left; vertical-align: top; }
.tbl thead th { font-weight: 500; color: #4A4B50; font-size: 13px; }
.field { display: flex; flex-direction: column; gap: 6px; font-size: 13px; font-weight: 500; }
.field input, .field select, .field textarea { height: 44px; padding: 0 12px; border: 1px solid #CFD0D4; border-radius: 6px; font-size: 15px; font-weight: 400; background: #FFFFFF; }
.field textarea { height: 110px; padding: 10px 12px; resize: vertical; }
.field .req { color: var(--bad); }
.field .err { color: var(--bad); font-weight: 400; font-size: 12px; }
.panel { border: 1px solid var(--line); border-radius: 10px; padding: 20px; }
.h-sec { margin: 0; font-size: 18px; font-weight: 700; }
.note { background: var(--soft); border-radius: 8px; padding: 16px 18px; color: var(--ink-2); line-height: 1.7; }
.empty { padding: 60px 20px; text-align: center; color: var(--sub); border: 1px dashed #CFD0D4; border-radius: 10px; }

/* list */
.shop { display: flex; flex-wrap: wrap; gap: 32px; align-items: flex-start; padding-block: 28px 64px; }
.filters { flex: 1 1 220px; max-width: 240px; display: flex; flex-direction: column; gap: 26px; }
.promo { background: var(--ink); color: #FFFFFF; border-radius: 8px; padding: 18px 16px; }
.promo span { display: block; font-size: 13px; color: #B9BABE; }
.promo strong { font-size: 17px; line-height: 1.45; }
.fgroup { display: flex; flex-direction: column; gap: 6px; }
.fgroup h2 { margin: 0 0 4px; font-size: 15px; display: flex; justify-content: space-between; align-items: center; }
.fgroup select { height: 40px; padding: 0 10px; border: 1px solid #DCDDE0; border-radius: 6px; background: #FFFFFF; }
.reset { border: none; background: none; font-size: 12px; color: var(--sub); cursor: pointer; min-height: 32px; }
.frow { display: flex; align-items: center; gap: 10px; min-height: 38px; cursor: pointer; }
.frow input { width: 18px; height: 18px; accent-color: var(--ink); }
.frow span:nth-of-type(1) { flex: 1; }
.frow .cnt { color: var(--sub); }
.frow.off { color: #8A8B90; cursor: default; }
.results { flex: 999 1 560px; min-width: 0; display: flex; flex-direction: column; gap: 18px; }
.chips { display: flex; flex-wrap: wrap; gap: 8px; }
.res-head { display: flex; justify-content: space-between; align-items: center; gap: 10px; flex-wrap: wrap; }
.res-head select { height: 36px; border: none; background: transparent; font-size: 13px; }
.grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(230px, 1fr)); gap: 28px 16px; }
.card { display: flex; flex-direction: column; gap: 11px; text-decoration: none; }
.card .ph { position: relative; height: 180px; background: var(--photo); border-radius: 8px; display: flex; align-items: center; justify-content: center; transition: background .15s; }
.card:hover .ph { background: #E5E6E9; }
.card:hover .ttl { text-decoration: underline; }
.ph .lb { position: absolute; top: 10px; left: 10px; font-size: 11px; font-weight: 700; background: #FFFFFF; border-radius: 4px; padding: 3px 7px; }
.card .meta { display: flex; flex-direction: column; gap: 3px; }
.card .cat { font-size: 12px; color: var(--sub); }
.card .ttl { font-size: 15px; font-weight: 700; }
.card .sub2 { font-size: 13px; color: #4A4B50; }
.card .code { font-size: 12px; color: var(--blue); }
.card .pr { display: flex; justify-content: space-between; align-items: center; }
.card .price { font-size: 17px; font-weight: 700; }
.card .tags { display: flex; flex-wrap: wrap; gap: 4px; }
.pager { display: flex; justify-content: center; gap: 4px; margin-top: 20px; }
.pager button { width: 36px; height: 36px; border: none; background: transparent; border-radius: 6px; cursor: pointer; color: #4A4B50; }
.pager button.on { background: var(--ink); color: #FFFFFF; font-weight: 700; }

/* detail */
.dtop { display: flex; flex-wrap: wrap; gap: 48px; align-items: flex-start; padding-block: 24px 8px; }
.gallery { flex: 1 1 500px; min-width: 0; display: flex; flex-direction: column; gap: 10px; }
.gallery .main { position: relative; height: 420px; background: var(--photo); border-radius: 10px; display: flex; align-items: center; justify-content: center; }
.gallery .main .cap { position: absolute; left: 14px; bottom: 14px; font-size: 12px; color: var(--sub); }
.gallery .arr { position: absolute; top: 50%; margin-top: -22px; width: 44px; height: 44px; border: none; background: rgba(255,255,255,.7); border-radius: 50%; cursor: pointer; display: flex; align-items: center; justify-content: center; }
.thumbs { display: grid; grid-template-columns: repeat(6, minmax(0, 1fr)); gap: 8px; }
.thumbs button { height: 72px; border: 2px solid transparent; background: var(--photo); border-radius: 6px; cursor: pointer; font-size: 11px; color: #4A4B50; line-height: 1.3; }
.thumbs button.on { border-color: var(--ink); background: #E3E4E7; }
.info { flex: 1 1 420px; min-width: 0; display: flex; flex-direction: column; gap: 14px; }
.badges { display: flex; flex-wrap: wrap; }
.badges span { font-size: 13px; font-weight: 500; padding: 5px 10px; }
.badges span:first-child { background: var(--ink); color: #FFFFFF; border-radius: 4px 0 0 4px; }
.badges span:nth-child(2) { background: var(--line); }
.badges span:last-child { color: #FFFFFF; font-weight: 700; border-radius: 0 4px 4px 0; }
.info h1 { margin: 0; font-size: 28px; letter-spacing: -0.02em; }
.pricebox { border-top: 1px solid var(--ink); border-bottom: 1px solid var(--line); padding-block: 16px; }
.pricebox b { font-size: 30px; }
.cert { border: 1px solid var(--ink); border-radius: 8px; overflow: hidden; }
.cert-h { display: flex; justify-content: space-between; flex-wrap: wrap; gap: 6px; background: var(--ink); color: #FFFFFF; padding: 10px 16px; }
.cert-h h2 { margin: 0; font-size: 14px; }
.cert-h span { font-size: 12px; color: #C9CACE; }
.cert-g { display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); }
.cert-g div { padding: 14px 12px; display: flex; flex-direction: column; gap: 3px; border-right: 1px solid var(--line); }
.cert-g div:last-child { border-right: none; }
.cert-g small { font-size: 12px; color: var(--sub); }
.cert-g b { font-size: 18px; }
.cert-g em { font-style: normal; font-size: 12px; color: #4A4B50; }
.cert-f { display: flex; justify-content: space-between; flex-wrap: wrap; gap: 6px; border-top: 1px solid var(--line); padding: 10px 16px; font-size: 13px; color: #4A4B50; }
.cert-f a { color: var(--ink); font-weight: 700; }
.ship { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); border: 1px solid var(--line); border-radius: 8px; }
.ship div { padding: 14px 16px; display: flex; flex-direction: column; gap: 3px; }
.ship div + div { border-left: 1px solid var(--line); }
.ship small { font-size: 12px; color: var(--sub); }
.cta { display: flex; gap: 8px; }
.cta .btn { flex: 1; height: 54px; font-size: 16px; }
.dbottom { display: flex; flex-wrap: wrap; gap: 32px; align-items: flex-start; border-top: 2px solid var(--ink); margin-top: 32px; padding-bottom: 64px; }
.dmain { flex: 999 1 560px; min-width: 0; display: flex; flex-direction: column; gap: 28px; }
.tabs { display: flex; flex-wrap: wrap; border-bottom: 1px solid var(--line); }
.tabs button { padding: 16px 20px; border: none; background: none; font-size: 15px; color: var(--sub); cursor: pointer; border-bottom: 2px solid transparent; margin-bottom: -1px; }
.tabs button[aria-selected="true"] { color: var(--ink); font-weight: 700; border-bottom-color: var(--ink); }
.side { flex: 1 1 280px; max-width: 320px; padding-top: 24px; display: flex; flex-direction: column; gap: 12px; position: sticky; top: calc(env(safe-area-inset-top, 0px) + 52px); }
.side .tot { display: flex; justify-content: space-between; align-items: center; background: var(--soft); border-radius: 8px; padding: 16px; }
.side .tot b { font-size: 22px; }
.timeline { list-style: none; margin: 0; padding: 0; border-top: 1px solid var(--ink); }
.timeline li { display: grid; grid-template-columns: 110px 1fr auto; gap: 12px; padding: 13px 10px; border-bottom: 1px solid var(--line); }
.timeline time { color: #4A4B50; }
.timeline span:last-child { color: #4A4B50; text-align: right; }
.qa { border-top: 1px solid var(--ink); }
.qa details { border-bottom: 1px solid var(--line); }
.qa summary { padding: 14px 10px; cursor: pointer; display: flex; gap: 10px; flex-wrap: wrap; }
.qa summary .st { font-size: 12px; font-weight: 700; padding: 2px 6px; border-radius: 4px; }
.qa .ans { padding: 4px 10px 16px 34px; color: var(--ink-2); line-height: 1.7; }

/* forms pages */
.form-page { display: flex; flex-wrap: wrap; gap: 32px; align-items: flex-start; padding-block: 28px 64px; }
.form-main { flex: 999 1 520px; min-width: 0; display: flex; flex-direction: column; gap: 28px; }
.form-side { flex: 1 1 300px; max-width: 360px; display: flex; flex-direction: column; gap: 12px; position: sticky; top: calc(env(safe-area-inset-top, 0px) + 52px); }
.fgrid { display: grid; grid-template-columns: repeat(auto-fit, minmax(220px, 1fr)); gap: 16px; }
.radio-cards { display: grid; grid-template-columns: repeat(auto-fit, minmax(200px, 1fr)); gap: 10px; }
.radio-cards label { display: flex; gap: 10px; align-items: flex-start; border: 1px solid #CFD0D4; border-radius: 8px; padding: 14px; cursor: pointer; }
.radio-cards label:has(input:checked) { border-color: var(--ink); box-shadow: inset 0 0 0 1px var(--ink); }
.radio-cards input { margin-top: 3px; accent-color: var(--ink); width: 16px; height: 16px; }
.radio-cards small { display: block; color: var(--sub); font-size: 12px; margin-top: 2px; }
.mini { display: flex; gap: 14px; align-items: center; }
.mini .ph { width: 84px; height: 66px; border-radius: 6px; background: var(--photo); flex-shrink: 0; display: flex; align-items: center; justify-content: center; }
.sum-row { display: flex; justify-content: space-between; padding: 6px 0; color: #4A4B50; }
.sum-row.total { border-top: 1px solid var(--line); margin-top: 6px; padding-top: 12px; color: var(--ink); font-weight: 700; font-size: 17px; }
.done { max-width: 620px; margin: 0 auto; padding-block: 64px 80px; display: flex; flex-direction: column; gap: 18px; text-align: center; align-items: center; }
.done .mark { width: 64px; height: 64px; border-radius: 50%; background: var(--ink); display: flex; align-items: center; justify-content: center; }
.done h1 { margin: 0; font-size: 26px; }
.done table { width: 100%; text-align: left; }
.stepper { display: flex; gap: 6px; font-size: 13px; color: var(--sub); flex-wrap: wrap; }
.stepper b { color: var(--ink); }

/* verify (mobile-like) */
.vwrap { max-width: 440px; margin: 0 auto; padding-block: 28px 64px; display: flex; flex-direction: column; gap: 18px; }
.vbox { display: flex; gap: 8px; }
.vbox input { flex: 1; min-width: 0; height: 48px; padding: 0 14px; border: 1px solid #CFD0D4; border-radius: 8px; font-size: 15px; }
.vok { background: var(--ink); color: #FFFFFF; border-radius: 10px; padding: 18px 20px; }
.vok span { display: block; font-size: 13px; color: #B9BABE; }
.vok strong { font-size: 18px; }
.vfail { border: 1px solid var(--bad); color: var(--bad); border-radius: 10px; padding: 16px 18px; }

/* content pages */
.page { padding-block: 32px 64px; display: flex; flex-direction: column; gap: 32px; max-width: 980px; }
.page h1 { margin: 0; font-size: 28px; letter-spacing: -0.02em; }
.page .lead { margin: 6px 0 0; color: var(--sub); font-size: 16px; }
.steps { list-style: none; margin: 0; padding: 0; display: grid; grid-template-columns: repeat(auto-fit, minmax(170px, 1fr)); border-top: 1px solid var(--ink); }
.steps li { padding: 16px 14px; border-bottom: 1px solid var(--line); display: flex; flex-direction: column; gap: 4px; }
.steps li b { font-size: 15px; }
.steps li small { color: var(--sub); font-size: 13px; }
.steps li .n { font-size: 12px; color: var(--sub); }

/* home, fit, compare */
.card-link { display: flex; flex-direction: column; gap: 11px; text-decoration: none; }
.cmp { display: flex; align-items: center; gap: 8px; font-size: 13px; color: #4A4B50; min-height: 32px; cursor: pointer; }
.cmp input { width: 16px; height: 16px; accent-color: var(--ink); }
.fit { border: 1px solid var(--line); border-radius: 8px; padding: 14px 16px; display: flex; flex-direction: column; gap: 8px; }
.fit-row { display: flex; flex-wrap: wrap; gap: 6px; }
.fit select { flex: 1 1 120px; min-width: 0; height: 36px; padding: 0 8px; border: 1px solid #CFD0D4; border-radius: 6px; background: #FFFFFF; }
.fit small { color: var(--sub); font-size: 12px; }
.hero { background: var(--soft); }
.hero .wrap { padding-block: 44px; display: flex; flex-direction: column; gap: 20px; }
.hero h1 { margin: 0; font-size: 34px; line-height: 1.3; letter-spacing: -0.02em; text-wrap: balance; }
.hero p { margin: 8px 0 0; font-size: 16px; color: var(--sub); }
.hero-form { display: flex; flex-wrap: wrap; gap: 8px; background: #FFFFFF; border: 1px solid var(--ink); border-radius: 10px; padding: 10px; max-width: 900px; }
.hero-form select { flex: 1 1 160px; min-width: 0; height: 48px; padding: 0 12px; border: none; border-radius: 6px; background: var(--soft); font-size: 15px; }
.hero-form .btn { flex: 0 1 140px; }
.cats { display: flex; flex-wrap: wrap; gap: 8px; }
.sec { padding-block: 36px 8px; display: flex; flex-direction: column; gap: 18px; }
.sec:last-child { padding-bottom: 64px; }
.sec-h { display: flex; justify-content: space-between; align-items: baseline; gap: 10px; flex-wrap: wrap; }
.sec-h h2 { margin: 0; font-size: 22px; letter-spacing: -0.01em; }
.sec-h a { font-size: 13px; color: var(--sub); text-decoration: none; }
.gcols { display: grid; grid-template-columns: repeat(auto-fit, minmax(260px, 1fr)); border-top: 1px solid var(--ink); }
.gcol { padding: 20px 18px; border-bottom: 1px solid var(--line); display: flex; flex-direction: column; gap: 10px; text-decoration: none; }
.gcol + .gcol { border-left: 1px solid var(--line); }
.gcol:hover { background: var(--soft); }
.gmark { width: 34px; height: 34px; border-radius: 6px; color: #FFFFFF; font-weight: 700; font-size: 18px; display: inline-flex; align-items: center; justify-content: center; }
.gcol dl { margin: 0; display: grid; grid-template-columns: 84px 1fr; gap: 4px 10px; font-size: 13px; }
.gcol dt { color: var(--sub); }
.gcol dd { margin: 0; }
.seller { background: var(--ink); color: #FFFFFF; border-radius: 10px; padding: 28px; display: flex; flex-wrap: wrap; justify-content: space-between; align-items: center; gap: 16px; }
.seller .btn { color: var(--ink); }

/* photos, type filter, home v2 */
.ph, .gallery .main, .mini .ph { overflow: hidden; }
.mini .ph, .thumbs button { position: relative; overflow: hidden; }
.ph img, .gallery .main img, .thumbs img, .tile img { position: absolute; inset: 0; width: 100%; height: 100%; object-fit: cover; }
.ph .lb, .gallery .arr, .gallery .main .cap { z-index: 1; }
.gallery .main .cap { background: rgba(255,255,255,.88); padding: 2px 8px; border-radius: 4px; }
.promo { display: block; text-decoration: none; }
.tbtn { display: flex; justify-content: space-between; align-items: center; width: 100%; min-height: 38px; padding: 0; border: none; background: none; cursor: pointer; text-align: left; }
.tbtn.on { font-weight: 700; }
.tbtn .cnt { color: var(--sub); font-weight: 400; }
.hero { background: #FFFFFF; border-bottom: 1px solid var(--line); }
.hero .wrap { align-items: center; text-align: center; padding-block: 56px 44px; gap: 16px; }
.hero h1 { font-size: 32px; }
.hero-search { display: flex; width: 100%; max-width: 720px; border: 2px solid var(--ink); border-radius: 8px; overflow: hidden; }
.hero-search input { flex: 1; min-width: 0; height: 54px; border: none; padding: 0 16px; font-size: 16px; outline: none; }
.hero-search button { width: 64px; border: none; background: var(--ink); color: #FFFFFF; cursor: pointer; display: flex; align-items: center; justify-content: center; }
.hero-form { border: none; padding: 0; max-width: 720px; width: 100%; }
.hero-form select { height: 44px; font-size: 14px; }
.hot { display: flex; flex-wrap: wrap; gap: 4px 14px; justify-content: center; align-items: center; font-size: 13px; color: var(--sub); }
.hot button { border: none; background: none; color: var(--ink-2); cursor: pointer; padding: 6px 0; font-size: 13px; }
.hot button:hover { text-decoration: underline; }
.hero .total { margin: 0; font-size: 14px; color: var(--sub); }
.hero .total b { color: var(--ink); font-size: 18px; }
.tiles { display: grid; grid-template-columns: repeat(auto-fit, minmax(200px, 1fr)); gap: 16px; }
.tile { position: relative; display: block; height: 170px; border-radius: 8px; overflow: hidden; background: #3A3D42; text-decoration: none; color: #FFFFFF; }
.tile::after { content: ""; position: absolute; inset: 50% 0 0; background: linear-gradient(transparent, rgba(13,13,14,.8)); }
.tile span { position: absolute; left: 14px; bottom: 12px; z-index: 1; font-weight: 700; font-size: 17px; color: #FFFFFF; }
.tile small { font-weight: 400; font-size: 13px; margin-left: 6px; }
.svc { display: grid; grid-template-columns: repeat(auto-fit, minmax(220px, 1fr)); border-top: 1px solid var(--ink); border-bottom: 1px solid var(--line); }
.svc a { padding: 20px 16px; text-decoration: none; display: flex; flex-direction: column; gap: 4px; }
.svc a:hover { background: var(--soft); }
.svc b { font-size: 16px; }
.svc span { color: var(--sub); font-size: 13px; }

/* accounts */
.util-bar { border-bottom: 1px solid var(--line); }
.util-bar .wrap { display: flex; justify-content: flex-end; align-items: center; flex-wrap: wrap; gap: 2px 16px; min-height: 32px; padding-block: 2px; font-size: 12px; color: var(--sub); }
.util-bar a, .linkbtn { color: var(--sub); text-decoration: none; background: none; border: none; padding: 4px 0; cursor: pointer; font-size: 12px; font-family: inherit; }
.util-bar a:hover, .linkbtn:hover { color: var(--ink); text-decoration: underline; }
.util-bar b { color: var(--ink); font-weight: 500; }
.auth { display: flex; flex-wrap: wrap; gap: 40px; padding-block: 44px 72px; align-items: flex-start; justify-content: center; }
.auth-form { flex: 1 1 340px; max-width: 420px; display: flex; flex-direction: column; gap: 14px; }
.auth-form h1, .gatebox h1 { margin: 0; font-size: 26px; }
.auth-links { display: flex; justify-content: center; gap: 14px; font-size: 13px; color: var(--sub); }
.auth-links a { color: var(--sub); }
.demo-acc { flex: 1 1 340px; max-width: 480px; display: flex; flex-direction: column; gap: 10px; background: var(--soft); border-radius: 10px; padding: 20px; }
.demo-acc p { margin: 0; font-size: 13px; color: var(--sub); }
.acc-list { display: grid; grid-template-columns: repeat(auto-fit, minmax(190px, 1fr)); gap: 8px; }
.acc { text-align: left; border: 1px solid #CFD0D4; border-radius: 8px; background: #FFFFFF; padding: 14px; cursor: pointer; display: flex; flex-direction: column; gap: 2px; font-family: inherit; }
.acc:hover { border-color: var(--ink); }
.acc-role { font-size: 12px; font-weight: 700; color: var(--blue); }
.acc b { font-size: 15px; }
.acc small { color: var(--sub); font-size: 12px; }
.gatebox { max-width: 640px; margin: 0 auto; padding-block: 56px 80px; display: flex; flex-direction: column; gap: 14px; }
.gatebox > p { margin: 0; color: var(--ink-2); }
.gatebox .demo-acc { max-width: none; }
.acct { display: flex; flex-wrap: wrap; gap: 32px; padding-block: 28px 64px; align-items: flex-start; }
.acct-nav { flex: 1 1 200px; max-width: 220px; display: flex; flex-direction: column; border-top: 2px solid var(--ink); }
.acct-nav > b { padding: 14px 4px; font-size: 18px; border-bottom: 1px solid var(--line); }
.acct-nav a { display: flex; justify-content: space-between; gap: 8px; padding: 12px 4px; border-bottom: 1px solid var(--line); text-decoration: none; color: var(--ink-2); }
.acct-nav a.on { font-weight: 700; color: var(--ink); }
.acct-nav .cnt { color: var(--sub); font-weight: 400; font-size: 13px; }
.acct-main { flex: 999 1 560px; min-width: 0; display: flex; flex-direction: column; gap: 20px; }
.acct-head { display: flex; flex-wrap: wrap; justify-content: space-between; align-items: center; gap: 16px; background: var(--soft); border-radius: 10px; padding: 20px 22px; }
.acct-head span { font-size: 13px; color: var(--sub); }
.acct-head h1 { margin: 2px 0 0; font-size: 22px; }
.stat-row { display: flex; gap: 8px; flex-wrap: wrap; }
.stat { background: #FFFFFF; border-radius: 8px; padding: 10px 16px; min-width: 120px; display: flex; flex-direction: column; }
.stat small { font-size: 12px; color: var(--sub); }
.stat b { font-size: 20px; }
.pill { display: inline-block; font-size: 12px; font-weight: 700; border-radius: 999px; padding: 3px 9px; background: var(--line); color: var(--ink-2); white-space: nowrap; }
.pill.blue { background: #E3EEFB; color: #174EA6; }
.pill.green { background: #E2F3E9; color: #00612F; }
.pill.orange { background: #FDEFD9; color: #8A3E05; }
.pill.dark { background: var(--ink); color: #FFFFFF; }
.stages { display: grid; grid-template-columns: repeat(auto-fit, minmax(118px, 1fr)); border: 1px solid var(--line); border-radius: 10px; overflow: hidden; }
.stages button { border: none; border-right: 1px solid var(--line); background: #FFFFFF; padding: 12px 14px; text-align: left; cursor: pointer; display: flex; flex-direction: column; gap: 2px; font-family: inherit; }
.stages button:last-child { border-right: none; }
.stages button.on { background: var(--soft); box-shadow: inset 0 -2px 0 var(--ink); }
.stages small { font-size: 12px; color: var(--sub); }
.stages b { font-size: 22px; }
.qcard { border: 1px solid var(--line); border-radius: 10px; padding: 16px 18px; display: flex; flex-direction: column; gap: 8px; }
.qcard .top { display: flex; flex-wrap: wrap; justify-content: space-between; gap: 8px; }
.qcard .ans { background: var(--soft); border-radius: 6px; padding: 10px 12px; font-size: 14px; }
.reply { display: flex; flex-wrap: wrap; gap: 6px; }
.reply input { height: 36px; border: 1px solid #CFD0D4; border-radius: 6px; padding: 0 10px; min-width: 0; }
.wishbtn { border: none; background: none; cursor: pointer; display: inline-flex; align-items: center; gap: 4px; font-size: 13px; color: #4A4B50; min-height: 32px; font-family: inherit; }
.wishbtn.on { color: var(--bad); font-weight: 700; }
.btn.wishbtn { border: 1px solid #C9CACE; }
.card-foot { display: flex; justify-content: space-between; align-items: center; gap: 8px; }
.bo-top .bo-out { color: #FFFFFF; border: 1px solid #6F86A6; padding: 4px 10px; background: none; cursor: pointer; font-size: 13px; font-family: inherit; }
.bo-btn.sm { height: 30px; padding: 0 10px; font-size: 13px; }
.bo-link { color: var(--navy); font-weight: 700; }
.bo-panel { border: 1px solid #D9D9D9; padding: 16px; display: flex; flex-direction: column; gap: 10px; }
.bo-stats { display: grid; grid-template-columns: repeat(auto-fit, minmax(130px, 1fr)); border: 1px solid #D9D9D9; }
.bo-stats div { padding: 12px 14px; border-right: 1px solid #D9D9D9; display: flex; flex-direction: column; }
.bo-stats div:last-child { border-right: none; }
.bo-stats small { font-size: 12px; color: #555555; }
.bo-stats b { font-size: 22px; }

/* GPARTS-style header, banner, bands */
.site-header .hd-top { display: flex; flex-wrap: wrap; align-items: center; gap: 12px 22px; min-height: 92px; padding-block: 14px; }
.logo-mark { width: 40px; height: 40px; border-radius: 10px; background: var(--brand); color: #FFFFFF; font-weight: 700; font-size: 15px; display: inline-flex; align-items: center; justify-content: center; }
.hsearch { flex: 1 1 420px; min-width: 0; max-width: 620px; display: flex; flex-direction: column; border: 2px solid var(--brand); border-radius: 6px; overflow: hidden; }
.hsel { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); border-bottom: 1px solid #CFE3D6; }
.hsel select { height: 38px; border: none; border-right: 1px solid #DDE7E0; padding: 0 10px; background: #FFFFFF; font-size: 13px; min-width: 0; }
.hsel select:last-child { border-right: none; }
.hq { display: flex; }
.hq input { flex: 1; min-width: 0; height: 42px; border: none; padding: 0 14px; font-size: 14px; outline: none; }
.hq button { width: 64px; border: none; background: var(--brand); color: #FFFFFF; cursor: pointer; display: flex; align-items: center; justify-content: center; }
.hq button:hover { background: var(--brand-dark); }
.hicons { display: flex; margin-left: auto; }
.hicons a, .hicons button { display: flex; flex-direction: column; align-items: center; gap: 3px; min-width: 60px; padding: 4px 6px; border: none; background: none; text-decoration: none; color: var(--ink-2); font-size: 12px; cursor: pointer; font-family: inherit; white-space: nowrap; }
.hicons a:hover, .hicons button:hover { color: var(--brand); }
.hcount { display: flex; flex-direction: column; align-items: center; justify-content: center; background: #26282C; color: #FFFFFF; border-radius: 6px; padding: 8px 14px; text-decoration: none; min-width: 96px; }
.hcount small { font-size: 11px; color: #C9CACE; }
.hcount b { font-size: 20px; }
.hd-nav { border-top: 1px solid var(--line); background: #FFFFFF; }
.site-header .hd-nav .wrap { display: flex; flex-wrap: wrap; align-items: stretch; gap: 0 28px; min-height: 48px; padding-block: 0; }
.cat { position: relative; }
.cat-btn { min-height: 48px; display: flex; align-items: center; gap: 8px; padding: 0 22px; border: none; background: var(--brand); color: #FFFFFF; font-weight: 700; font-size: 15px; cursor: pointer; font-family: inherit; }
.cat-btn:hover { background: var(--brand-dark); }
.cat-panel { position: absolute; top: 100%; left: 0; z-index: 40; background: #FFFFFF; border: 1px solid var(--brand); display: grid; grid-template-columns: repeat(4, 170px); box-shadow: 0 10px 24px rgba(17,18,20,.14); }
.cat-col { padding: 16px; display: flex; flex-direction: column; gap: 7px; border-right: 1px solid var(--line); }
.cat-col:last-child { border-right: none; }
.cat-col a { text-decoration: none; font-size: 13px; color: var(--ink-2); }
.cat-col a:hover { color: var(--brand); text-decoration: underline; }
.cat-col a:first-child { font-size: 15px; color: var(--ink); }
.cat-col a:first-child .num { color: var(--brand); font-weight: 700; }
.cat-col small { color: var(--sub); font-size: 12px; margin-bottom: 4px; }
.hd-nav .gnb { display: flex; flex-wrap: wrap; align-items: center; gap: 0 26px; }
.hd-nav .gnb a { font-size: 15px; padding: 13px 0; color: var(--ink-2); }
.hd-nav .gnb a.on { color: var(--brand); font-weight: 700; box-shadow: inset 0 -2px 0 var(--brand); }
.banner { border-bottom: 1px solid var(--line); }
.slides { position: relative; height: 340px; overflow: hidden; }
.slide { position: absolute; inset: 0; opacity: 0; visibility: hidden; transition: opacity .5s, visibility .5s; }
.slide.on { opacity: 1; visibility: visible; }
.slide-in { height: 100%; display: grid; grid-template-columns: minmax(0, 1fr) minmax(0, 1fr); align-items: center; gap: 32px; }
.slide-txt { display: flex; flex-direction: column; gap: 12px; align-items: flex-start; }
.slide-txt .eye { font-size: 15px; color: var(--ink-2); }
.slide-txt h2 { margin: 0; font-size: 34px; line-height: 1.3; letter-spacing: -0.02em; }
.slide-txt p { margin: 0; color: var(--ink-2); }
.slide-img { position: relative; height: 270px; border-radius: 12px; overflow: hidden; background: var(--photo); }
.slide-img img { position: absolute; inset: 0; width: 100%; height: 100%; object-fit: cover; }
.btabs { display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)) 44px 44px 44px; border: 1px solid var(--line); border-top: none; }
.btabs button { height: 46px; border: none; border-right: 1px solid var(--line); background: #FFFFFF; cursor: pointer; font-size: 14px; color: var(--ink-2); font-family: inherit; display: flex; align-items: center; justify-content: center; }
.btabs button:last-child { border-right: none; }
.btabs button[aria-selected="true"] { background: #26282C; color: #FFFFFF; font-weight: 700; }
.btn.brand { background: var(--brand); border-color: var(--brand); color: #FFFFFF; }
.btn.brand:hover { background: var(--brand-dark); }
.shopband { background: var(--brand-soft); margin-top: 40px; }
.shopband .wrap { padding-block: 36px 40px; display: flex; flex-direction: column; align-items: center; gap: 12px; text-align: center; }
.shopband .pin { color: var(--brand); }
.shopband h2 { margin: 0; font-size: 24px; }
.shopband p { margin: 0; color: var(--ink-2); }
.shopform { display: flex; flex-wrap: wrap; gap: 8px; justify-content: center; width: 100%; max-width: 640px; }
.shopform select { height: 46px; flex: 1 1 180px; max-width: 220px; border: 1px solid #C9D6CE; border-radius: 4px; padding: 0 10px; background: #FFFFFF; }
.infoband { background: var(--soft); border-top: 1px solid var(--line); }
.infoband .wrap { padding-block: 32px 40px; display: grid; grid-template-columns: repeat(auto-fit, minmax(190px, 1fr)); gap: 28px; }
.ibox { display: flex; flex-direction: column; gap: 8px; min-width: 0; }
.ibox h3 { margin: 0; font-size: 16px; display: flex; justify-content: space-between; align-items: baseline; gap: 8px; }
.ibox h3 a { font-size: 12px; color: var(--sub); font-weight: 400; text-decoration: none; }
.ibox ul { list-style: none; margin: 0; padding: 0; display: flex; flex-direction: column; gap: 7px; font-size: 13px; }
.ibox ul a { color: var(--ink-2); text-decoration: none; display: block; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.ibox ul a:hover { text-decoration: underline; }
.ibox p { margin: 0; font-size: 13px; color: var(--sub); line-height: 1.6; }
.ibox .tel { font-size: 22px; }
.ibox .more { font-size: 13px; font-weight: 700; color: var(--ink); text-decoration: none; display: inline-flex; align-items: center; gap: 4px; }
.ibox .iic { color: var(--brand); }
.vmini { display: flex; gap: 6px; }
.vmini input { flex: 1; min-width: 0; height: 36px; border: 1px solid #CFD0D4; border-radius: 4px; padding: 0 10px; }
.shopgrid { display: grid; grid-template-columns: repeat(auto-fill, minmax(260px, 1fr)); gap: 16px; }
.shopcard { border: 1px solid var(--line); border-radius: 10px; padding: 18px; display: flex; flex-direction: column; gap: 8px; }
.shopcard b { font-size: 16px; }
.shopcard .addr { font-size: 13px; color: var(--sub); }
.shopcard .tags { display: flex; flex-wrap: wrap; gap: 4px; }
.notice-list details { border-bottom: 1px solid var(--line); }
.notice-list summary { padding: 14px 10px; cursor: pointer; display: grid; grid-template-columns: 70px 1fr auto; gap: 10px; align-items: baseline; }
.notice-list .ans { padding: 4px 10px 18px 90px; color: var(--ink-2); line-height: 1.7; }
.quick { position: fixed; right: max(14px, env(safe-area-inset-right, 0px)); top: 50%; transform: translateY(-50%); z-index: 30; width: 92px; background: #FFFFFF; border: 1px solid var(--line); border-radius: 8px; padding: 10px 8px; display: flex; flex-direction: column; align-items: center; gap: 6px; box-shadow: 0 4px 14px rgba(17,18,20,.08); text-align: center; }
.quick > b { font-size: 12px; }
.quick > .num { font-size: 12px; color: var(--brand); font-weight: 700; margin-top: -4px; }
.quick a { display: flex; flex-direction: column; align-items: center; gap: 2px; text-decoration: none; color: var(--ink-2); }
.quick .qimg { position: relative; width: 64px; height: 50px; border-radius: 4px; overflow: hidden; background: var(--photo); display: flex; align-items: center; justify-content: center; }
.quick .qimg img { position: absolute; inset: 0; width: 100%; height: 100%; object-fit: cover; }
.quick small { font-size: 11px; max-width: 76px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.quick .none { color: var(--sub); }
.quick button { width: 100%; height: 30px; border: none; border-top: 1px solid var(--line); background: none; font-size: 12px; font-weight: 700; cursor: pointer; margin-top: 4px; font-family: inherit; }
.ft-bottom { background: #3A3D42; color: #C9CACE; font-size: 12px; }
.site-footer .ft-bottom .wrap { display: block; padding-block: 14px; line-height: 1.6; color: #D5D6DA; }
@media (max-width: 1479px) {
  .quick { top: auto; bottom: calc(80px + env(safe-area-inset-bottom, 0px)); transform: none; width: auto; padding: 0; border-radius: 50%; }
  .quick > :not([data-top]) { display: none; }
  .quick button { width: 46px; height: 46px; border: none; margin: 0; }
}
@media (max-width: 760px) {
  .hicons { margin-left: 0; order: 3; }
  .hcount { display: none; }
  .hsearch { order: 4; flex-basis: 100%; }
  .cat-panel { grid-template-columns: repeat(2, minmax(140px, 1fr)); }
  .cat-btn { padding: 0 14px; }
  .slides { height: 290px; }
  .slide-in { grid-template-columns: 1fr; }
  .slide-img { display: none; }
  .slide-txt h2 { font-size: 25px; }
  .btabs { grid-template-columns: repeat(4, minmax(0, 1fr)); }
  .btabs .bctl { display: none; }
  .notice-list summary { grid-template-columns: 1fr; }
  .notice-list .ans { padding-left: 10px; }
}
@media (prefers-reduced-motion: reduce) { .slide { transition: none; } }

/* grouped part types, alerts, charts */
.tgroup { border-top: 1px solid var(--line); }
.tgroup summary { display: flex; align-items: center; gap: 8px; padding: 10px 0 6px; cursor: pointer; font-size: 13px; font-weight: 700; color: var(--sub); list-style: none; }
.tgroup summary::-webkit-details-marker { display: none; }
.tgroup summary > span:first-child { flex: 1; }
.tgroup summary::after { content: "−"; width: 14px; text-align: center; }
.tgroup:not([open]) summary::after { content: "+"; }
.tgroup summary .cnt { font-weight: 400; }
.tgroup .tbtn, .tgroup .frow { padding-left: 10px; }
.alerts { list-style: none; margin: 0; padding: 0; border-top: 1px solid var(--ink); }
.alerts li a { display: flex; justify-content: space-between; gap: 12px; padding: 14px 10px; border-bottom: 1px solid var(--line); text-decoration: none; color: var(--ink-2); }
.alerts li.new a { color: var(--ink); font-weight: 500; background: #F7FAF8; }
.alerts small { color: var(--sub); flex-shrink: 0; }
.alerts .dot { display: inline-block; width: 7px; height: 7px; border-radius: 50%; background: var(--bad); margin-right: 8px; vertical-align: middle; }
.badge-n { display: inline-block; min-width: 16px; padding: 0 5px; border-radius: 8px; background: var(--bad); color: #FFFFFF !important; font-size: 11px; line-height: 16px; text-align: center; font-weight: 700; }
.chart-wrap { overflow-x: auto; }
.chart { display: block; width: 100%; min-width: 520px; height: auto; }
.page .chart { max-width: 860px; }
.legend { display: flex; flex-wrap: wrap; gap: 6px 16px; font-size: 13px; color: var(--ink-2); }
.legend i { display: inline-block; width: 12px; height: 12px; border-radius: 3px; margin-right: 6px; vertical-align: -1px; }
.tview summary { cursor: pointer; font-size: 13px; color: var(--sub); padding: 4px 0; }
.tview .tbl { margin-top: 6px; }
.pcards { display: grid; grid-template-columns: repeat(auto-fit, minmax(200px, 1fr)); gap: 12px; }
.pcard { border: 1px solid var(--line); border-radius: 10px; padding: 16px 18px; display: flex; flex-direction: column; gap: 6px; }
.pcard b { font-size: 24px; }
.pcard b small { font-size: 14px; font-weight: 500; }
.dash-grid .chart { min-width: 340px; }
.dash-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(min(100%, 380px), 1fr)); gap: 16px; }
.tip { position: fixed; z-index: 60; background: #26282C; color: #FFFFFF; font-size: 12px; padding: 6px 9px; border-radius: 6px; pointer-events: none; max-width: 300px; line-height: 1.5; }

/* footer */
.site-footer { background: #F8F8F9; border-top: 1px solid var(--line); }
.site-footer .wrap { display: flex; flex-wrap: wrap; justify-content: space-between; gap: 16px; padding-block: 28px 36px; font-size: 12px; line-height: 1.8; color: var(--sub); }
.site-footer .links { display: flex; gap: 16px; font-size: 13px; color: var(--ink-2); margin-bottom: 8px; }
.site-footer .links a { text-decoration: none; }
.site-footer .cs { text-align: right; }
.site-footer .cs b { display: block; font-size: 20px; color: var(--ink); }

/* back office */
.bo { min-height: 100vh; display: flex; flex-direction: column; font-size: 14px; color: #222222; }
.bo-top { background: var(--navy); color: #FFFFFF; }
.bo-top .in { padding: 8px max(24px, env(safe-area-inset-right, 0px)) 8px max(24px, env(safe-area-inset-left, 0px)); min-height: 52px; display: flex; flex-wrap: wrap; align-items: center; justify-content: space-between; gap: 10px; }
.bo-top b { font-size: 16px; }
.bo-top span { font-weight: 400; font-size: 13px; color: #C7D2E0; }
.bo-top a { color: #FFFFFF; border: 1px solid #6F86A6; padding: 4px 10px; text-decoration: none; font-size: 13px; }
.bo-body { display: flex; flex-wrap: wrap; flex: 1; }
.bo-nav { flex: 1 1 200px; max-width: 220px; background: #F3F4F6; border-right: 1px solid #D9D9D9; padding-block: 16px; padding-left: env(safe-area-inset-left, 0px); }
.bo-nav .g { padding: 14px 20px 6px; font-size: 12px; color: #555555; }
.bo-nav a { display: block; padding: 10px 20px 10px 28px; text-decoration: none; color: #222222; }
.bo-nav a.on { background: #FFFFFF; border-left: 3px solid var(--navy); color: var(--navy); font-weight: 700; }
.bo-main { flex: 999 1 560px; min-width: 0; padding: 20px max(24px, env(safe-area-inset-right, 0px)) 40px 28px; display: flex; flex-direction: column; gap: 20px; }
.bo-title { display: flex; flex-wrap: wrap; justify-content: space-between; align-items: flex-end; gap: 8px; border-bottom: 2px solid #222222; padding-bottom: 10px; }
.bo-title h1 { margin: 0; font-size: 20px; }
.bo-title span { font-size: 12px; color: #555555; }
.bo h2 { margin: 0 0 8px; font-size: 15px; }
.bo-tbl { width: 100%; border-collapse: collapse; border-top: 1px solid #222222; }
.bo-tbl th, .bo-tbl td { border-bottom: 1px solid #D9D9D9; padding: 8px 12px; text-align: left; }
.bo-tbl th { background: #F3F4F6; font-weight: 500; }
.bo-tbl thead th { background: #F3F4F6; border-bottom-color: #BFBFBF; }
.bo input[type="text"], .bo select { height: 32px; padding: 0 8px; border: 1px solid #BFBFBF; border-radius: 0; font-size: 14px; background: #FFFFFF; }
.bo input.warn { background: #FFF4E5; }
.bo input.bad { background: #FDECEA; }
.bo-btn { height: 40px; padding: 0 18px; border: 1px solid #BFBFBF; background: #FFFFFF; cursor: pointer; font-size: 14px; }
.bo-btn.gray { background: #555555; border-color: #555555; color: #FFFFFF; }

  function qr(seed) {

    for (var r = 0; r < n; r++) for (var c = 0; c < n; c++) {
      var on = f(r, c, 0, 0); if (on === null) on = f(r, c, 0, 14); if (on === null) on = f(r, c, 14, 0);
      if (on === null) { if ((r < 8 && c < 8) || (r < 8 && c > 12) || (r > 12 && c < 8)) on = false; else { s = (s * 9301 + 49297) % 233280; on = s / 233280 > 0.5; } }
      cells += '<i style="background:' + (on ? '#111111' : '#FFFFFF') + '"></i>';
    }
    return '<div class="qrgrid" aria-hidden="true">' + cells + '</div>';

  function login(acc) {
    state.user = acc; saveUser(acc.key || null);
    toast(acc.org + ' ' + acc.name + '님, 로그인했습니다.');
    if (location.hash === '#login') { var nx = state.next; state.next = ''; location.hash = nx && nx !== 'login' ? nx : ROLE_HOME[acc.role]; }
    else rerender();
  }
  function logout() {
    state.user = null; saveUser(null); toast('로그아웃했습니다.');
    if (/^#(my|seller|lab|admin)(-|$)/.test(location.hash)) location.hash = 'home'; else rerender();
  }
  function toggleWish(id) {
    if (!state.user) { state.next = location.hash.slice(1); toast('찜하기는 로그인 후 이용할 수 있습니다.'); location.hash = 'login'; return; }
    if (state.user.role !== 'buyer') { toast('찜하기는 구매자 계정에서 이용할 수 있습니다.'); return; }
    var i = state.wish.indexOf(id);
    if (i >= 0) { state.wish.splice(i, 1); toast('찜 목록에서 뺐습니다.'); } else { state.wish.push(id); toast('찜 목록에 담았습니다.'); }
    rerender();
  }

      notify('lab', '인력 파견 요청 ' + dno + ' (' + dty + ', ' + state.user.org + ')', 'lab-dispatch');
      rerender(); toast('파견을 요청했습니다. 담당자가 배정되면 알림으로 알려 드립니다.'); return;
    }
    if (f.id === 'noticeForm') {
      var nt = document.getElementById('nTitle').value.trim(), nb = document.getElementById('nBody').value.trim();
      if (!nt) { toast('제목을 입력해 주세요.'); return; }
      NOTICES.unshift([document.getElementById('nType').value, nt, TODAY, nb || nt]); rerender(); toast('공지를 등록했습니다.'); return;
    }
    if (f.id === 'shopForm') { state.shopSido = document.getElementById('shSido').value; state.shopGu = document.getElementById('shGu').value; if (location.hash !== '#shops') location.hash = 'shops'; else rerender(); return; }
    if (f.id === 'homeVerify') { var hv = document.getElementById('hv').value.trim(); location.hash = hv ? 'verify-' + hv : 'verify'; return; }
    if (f.id === 'qnaForm') {
      var qok = ['qnTitle', 'qnBody'].map(need).every(Boolean); if (!qok) return;
      state.qnaDone = true; rerender(); window.scrollTo(0, 0); return;
    }
    if (f.id === 'carForm') {
      var ck = document.getElementById('cCar').value; if (!ck) { toast('차종을 선택해 주세요.'); return; }
      state.myCar = { maker: ck.split('|')[0], car: ck.split('|')[1], year: document.getElementById('cYear').value }; rerender(); return;
    }
    if (f.id === 'heroForm') {
      var hk = document.getElementById('hCar').value, hy = document.getElementById('hYear').value;
      state.q = document.getElementById('hQ').value; state.type = document.getElementById('hType').value;
      state.grades = { A: true, B: true, C: true }; state.use = '전체'; state.year = hy;
      if (hk) { state.maker = hk.split('|')[0]; state.car = hk.split('|')[1]; state.myCar = { maker: state.maker, car: state.car, year: hy }; } else { state.maker = ''; state.car = ''; }
      location.hash = 'list'; return;
    }
    if (f.id === 'verifyForm') { var v = document.getElementById('vq').value.trim(); location.hash = v ? 'verify-' + v : 'verify'; return; }
    if (f.id === 'qaForm') {
      var txt = document.getElementById('qaText').value.trim(); var pid = (location.hash.match(/part-(.+)$/) || [])[1];
      document.getElementById('qaErr').hidden = !!txt; if (!txt) return;
      (state.qa[pid] = state.qa[pid] || []).unshift({ q: txt, a: '', st: '답변 대기' }); rerender(); toast('문의가 등록되었습니다.'); return;
    }
    if (f.id === 'loginForm') {
      var lid = document.getElementById('loginId').value.trim(), lpw = document.getElementById('loginPw').value;
      document.getElementById('loginIdErr').hidden = !!lid; document.getElementById('loginPwErr').hidden = !!lpw;
      if (!lid || !lpw) return;
      login(ACCOUNTS[lid] || { role: 'buyer', id: lid, name: lid, org: '개인', label: '구매자' }); return;
    }
    if (f.id === 'joinForm') {
      var jt = document.querySelector('input[name="jType"]:checked').value, orgNeed = jt !== 'personal';
      var jok = ['jName', 'jId', 'jPw', 'jPhone'].concat(orgNeed ? ['jOrg', 'jBiz'] : []).map(need).every(Boolean);
      var ja = document.getElementById('jAgree1').checked && document.getElementById('jAgree2').checked;
      document.getElementById('jAgreeErr').hidden = ja; if (!ja) jok = false;
      if (!jok) { toast('필수 항목을 확인해 주세요.'); return; }
      var jn = document.getElementById('jName').value.trim(), jo = orgNeed ? document.getElementById('jOrg').value.trim() : '개인';
      state.joinDone = { type: jt, name: jn, org: jo };
      if (jt === 'seller' || jt === 'lab') { MEMBERS.unshift({ no: 'MB-1114-' + String(MEMBERS.length + 1).padStart(2, '0'), type: jt === 'seller' ? '판매자' : '시험기관', org: jo, name: jn, biz: document.getElementById('jBiz').value.replace(/\d{5}$/, '*****'), date: TODAY, st: '승인 대기' }); notify('admin', '회원 가입 승인 대기: ' + jo, 'admin-members'); }
      if (jt === 'personal' || jt === 'company') { state.user = { role: 'buyer', id: document.getElementById('jId').value.trim(), name: jn, org: jo, label: '구매자', phone: document.getElementById('jPhone').value }; saveUser(null); }
      rerender(); window.scrollTo(0, 0); return;
    }
    if (f.id === 'myCarForm') {
      var mk = document.getElementById('mCar').value; if (!mk) { toast('차종을 선택해 주세요.'); return; }
      state.myCar = { maker: mk.split('|')[0], car: mk.split('|')[1], year: document.getElementById('mYear').value }; rerender(); toast('내 차량을 저장했습니다. 부품 목록에 호환 여부가 표시됩니다.'); return;
    }
    if (f.dataset.reply) {
      var rq = QUOTES.filter(function (q) { return q.no === f.dataset.reply; })[0];
      var rpv = document.getElementById('rp-' + rq.no).value, rmv = document.getElementById('rm-' + rq.no).value.trim();
      if (!rpv) { toast('개당 견적가를 입력해 주세요.'); return; }
      rq.st = '회신 완료'; rq.reply = '개당 ' + won(Number(rpv)) + '원' + (rmv ? '. ' + rmv : '');
      notify(rq.buyer, state.user.org + '가 견적 ' + rq.no + '에 회신했습니다.', 'my-quotes');
      rerender(); toast(rq.company + '에 견적을 회신했습니다.'); return;
    }
    if (f.id === 'fixForm') {
      var fp = byId[state.fix.pid], reason = document.getElementById('fixReason').value.trim();
      document.getElementById('fixReasonErr').hidden = !!reason; if (!reason) return;
      if (evaluate(state.fix.v, TYPES[fp.type].items).count['미입력']) { toast('측정값을 모두 입력해 주세요.'); return; }
      fp.v = Object.assign({}, state.fix.v); fp.ver += 1; fp.revs.push({ ver: fp.ver, date: TODAY, reason: reason }); prep(fp);
      state.fix = null; rerender(); toast('v' + fp.ver + '로 정정 발행했습니다. 상세 페이지와 성적서에 반영됩니다.'); return;
    }
    if (f.id === 'quoteForm') {
      var ok = ['qCompany', 'qName', 'qPhone'].map(need).every(Boolean);
      var use = document.getElementById('qUse').value; if (!use) { toast('사용 용도를 선택해 주세요.'); ok = false; }
      var ag = document.getElementById('qAgree').checked; document.getElementById('qAgreeErr').hidden = ag; if (!ag) ok = false;
      if (!ok) return;
      var qid = (location.hash.match(/quote-(.+)$/) || [])[1];
      state.lastQuote = { no: 'Q-2026-' + String(Date.now()).slice(-6), qty: document.getElementById('qQty').value || 1, use: use, company: document.getElementById('qCompany').value, name: document.getElementById('qName').value, phone: document.getElementById('qPhone').value };
      QUOTES.unshift({ no: state.lastQuote.no, id: qid, date: TODAY, qty: Number(state.lastQuote.qty), use: use, company: state.lastQuote.company, name: state.lastQuote.name, st: '접수', reply: '', buyer: state.user ? state.user.id : 'guest' });
      notify('seller', '새 견적 문의 ' + state.lastQuote.no + ' (' + state.lastQuote.company + ', ' + pname(byId[qid]) + ' ' + state.lastQuote.qty + '개)', 'seller-quotes');
      location.hash = 'quote-done-' + qid; return;
    }
    if (f.id === 'orderForm') {
      var visit = document.getElementById('sh2').checked;
      var fields = ['oCompany', 'oPhone'].concat(visit ? [] : ['oAddr']);
      var ok2 = fields.map(need).every(Boolean);
      var ag2 = document.getElementById('oAgree').checked; document.getElementById('oAgreeErr').hidden = ag2; if (!ag2) ok2 = false;
      if (!ok2) { toast('필수 항목을 확인해 주세요.'); return; }
      var oid = (location.hash.match(/order-(.+)$/) || [])[1];
      var payEl = document.querySelector('input[name="pay"]:checked');
      var payName = { bank: '무통장 입금', card: '카드 결제', tax: '세금계산서 발행 (계좌이체)' }[payEl.value];
      state.lastOrder = { no: 'OD-2026-' + String(Date.now()).slice(-6), pay: payName, payKey: payEl.value, ship: visit ? '방문 수령 · [창고 위치]' : '화물 배송 (착불) · ' + document.getElementById('oAddr').value };
      ORDERS.unshift({ no: state.lastOrder.no, id: oid, date: TODAY, price: byId[oid].price, pay: payName, payKey: payEl.value, ship: visit ? '방문 수령' : '화물 배송 (착불)', st: payEl.value === 'card' ? '결제 완료' : '입금 대기', buyer: state.user ? state.user.id : 'guest' });
      notify('seller', '새 주문 ' + state.lastOrder.no + ' · ' + pname(byId[oid]) + ' (' + won(byId[oid].price) + '원)', 'seller-settle');
      byId[oid].sold = true; state.compare = state.compare.filter(function (x) { return x !== oid; });
      location.hash = 'order-done-' + oid; return;
    }
    if (f.id === 'sellForm') {
      var ok3 = ['sCompany', 'sName', 'sPhone'].map(need).every(Boolean); if (!ok3) return;
      state.sellDone = 'S-2026-' + String(Date.now()).slice(-6); rerender(); return;
    }
  });
  var RM = !!(window.matchMedia && window.matchMedia('(prefers-reduced-motion: reduce)').matches);
  setInterval(function () {
    if (state.paused || RM || document.visibilityState !== 'visible') return;
    var bn = document.querySelector('.banner'); if (!bn || bn.matches(':hover') || bn.contains(document.activeElement)) return;
    setSlide(state.slide + 1);
  }, 6000);
  var tipEl = document.getElementById('tip');
  document.addEventListener('mousemove', function (e) {
    var h = e.target.closest ? e.target.closest('[data-tip]') : null;
    document.querySelectorAll('.xhair').forEach(function (x) { x.setAttribute('visibility', 'hidden'); });
    if (!h) { tipEl.hidden = true; return; }
    tipEl.textContent = h.getAttribute('data-tip'); tipEl.hidden = false;
    tipEl.style.left = Math.max(8, Math.min(e.clientX + 14, window.innerWidth - tipEl.offsetWidth - 8)) + 'px';
    tipEl.style.top = Math.min(e.clientY + 16, window.innerHeight - tipEl.offsetHeight - 8) + 'px';
    if (h.dataset.cx) { var xh = h.ownerSVGElement.querySelector('.xhair'); xh.setAttribute('x1', h.dataset.cx); xh.setAttribute('x2', h.dataset.cx); xh.setAttribute('visibility', 'visible'); }
  });
  window.addEventListener('hashchange', function () { tipEl.hidden = true; });
  window.addEventListener('hashchange', route);
  route();
})();
</script>
</body>
</html>
